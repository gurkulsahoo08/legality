baseURL = 'https://gurkulsahoo08.github.io/legality/'
languageCode = 'en-us'
title = 'Legality'
theme = 'PaperMod'

[pagination]
  pagerSize = 15

[params]
  env = 'production'
  description = 'Essays and long-form analysis.'
  author = 'Gurkul Sahoo'
  
  # Clean layout settings
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  
  # Reading ergonomics for text
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "Legality"
    Content = "A journal of truth about law."

  [params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 2
  keys = ["title", "permalink", "summary", "content"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "search/"
  weight = 10
